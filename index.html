<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级个人信息卡片</title>
    <style>
        /* ================= 1. 定义色彩主题 ================= */
        :root {
            --bg-color: #f0f2f5;         
            --card-bg: #ffffff;          
            --text-main: #2c3e50;        
            --text-sub: #7f8c8d;         
            --input-bg: #f8f9fa;         
            --input-border: #e2e8f0;     
            --btn-primary: #6c757d;      
            --btn-hover: #5a6268;        
            --shadow-color: rgba(0, 0, 0, 0.08); 
        }

        body.dark-mode {
            --bg-color: #1a1b1e;
            --card-bg: #25262b;
            --text-main: #e9ecef;
            --text-sub: #adb5bd;
            --input-bg: #2c2e33;
            --input-border: #495057;
            --btn-primary: #868e96;
            --btn-hover: #adb5bd;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        /* ================= 2. 整体布局与动画 ================= */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: background-color 0.4s ease; 
        }

        .card {
            background-color: var(--card-bg);
            width: 360px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            position: relative; 
            transition: all 0.4s ease;
        }

        /* ================= 3. 带 Emoji 的滑动开关 ================= */
        .theme-switch {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 32px;
            display: inline-block;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 32px;
            transition: background-color 0.4s;
        }

        .knob {
            position: absolute;
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:checked + .slider .knob {
            transform: translateX(28px);
        }

        /* Emoji 图案的样式 */
        .sun-icon, .moon-icon {
            position: absolute;
            font-size: 14px; /* 控制 Emoji 大小 */
            user-select: none; /* 防止双击选中表情 */
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sun-icon { opacity: 1; transform: rotate(0deg); }
        .moon-icon { opacity: 0; transform: rotate(-90deg); }

        input:checked + .slider .sun-icon { opacity: 0; transform: rotate(90deg); }
        input:checked + .slider .moon-icon { opacity: 1; transform: rotate(0deg); }

        /* ================= 4. 头像与上传 ================= */
        .avatar-container {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
            margin-top: 10px; 
        }

        #avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--input-bg); 
            border: 4px solid var(--card-bg);
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: border-color 0.4s ease;
        }

        #avatar-upload { display: none; }
        
        .upload-btn {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-sub);
            background-color: var(--input-bg);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background-color: var(--input-border);
            color: var(--text-main);
        }

        /* ================= 5. 文字与输入区域 ================= */
        .info-display h2 {
            margin: 0 0 10px 0;
            color: var(--text-main);
            font-size: 24px;
            transition: color 0.4s ease;
        }
        
        .info-display p {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            transition: color 0.4s ease;
        }

        .edit-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 2px rgba(108, 117, 125, 0.2);
        }

        textarea { resize: none; height: 80px; }

        #save-btn {
            background-color: var(--btn-primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
        }

        #save-btn:hover { background-color: var(--btn-hover); }
        #save-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <label class="theme-switch" for="theme-toggle" title="切换深色/浅色模式">
            <input type="checkbox" id="theme-toggle">
            <div class="slider">
                <div class="knob">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </div>
            </div>
        </label>

        <div class="avatar-container">
            <img id="avatar-img" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2QxZDVkOCI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00czEtMS43OS00LTQtNCAxLjc5LTQgNCAxLjc5IDQgNCA0em0wIDJjLTIuNjcgMC04IDEuMzQtOCA0djJoMTZ2LTJjMC0yLjY2LTUuMzMtNC04LTR6Ii8+PC9zdmc+" alt="默认头像">
            <label for="avatar-upload" class="upload-btn">📷 更换头像</label>
            <input type="file" id="avatar-upload" accept="image/*">
        </div>

        <div class="info-display">
            <h2 id="display-name">未知访客</h2>
            <p id="display-bio">这个人很懒，暂时还没有写简介。你可以在下方输入并保存。</p>
        </div>

        <div class="edit-area">
            <input type="text" id="name-input" placeholder="输入你的新名字">
            <textarea id="bio-input" placeholder="输入一段炫酷的自我介绍..."></textarea>
            <button id="save-btn">保存设置</button>
        </div>
    </div>

    <script>
        const avatarImg = document.getElementById('avatar-img');
        const avatarUpload = document.getElementById('avatar-upload');
        const displayName = document.getElementById('display-name');
        const displayBio = document.getElementById('display-bio');
        const nameInput = document.getElementById('name-input');
        const bioInput = document.getElementById('bio-input');
        const saveBtn = document.getElementById('save-btn');
        const themeToggle = document.getElementById('theme-toggle');

        // 保存更新信息
        saveBtn.addEventListener('click', function() {
            const newName = nameInput.value.trim();
            const newBio = bioInput.value.trim();

            if (newName) displayName.textContent = newName;
            if (newBio) displayBio.textContent = newBio;

            nameInput.value = '';
            bioInput.value = '';
        });

        // 头像预览
        avatarUpload.addEventListener('change', function(event) {
            const file = event.target.files[0]; 
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarImg.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 开关监听
        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        });
    </script>
</body>
</html>
